<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>決策執行儀表板 - 銷售報表直傳版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
:root{
  --bg:#080c14;--s1:#0f1420;--s2:#161d2e;--s3:#1d263d;--s4:#243047;
  --border:#1e2a42;--border2:#2a3858;
  --blue:#3b82f6;--blue2:#60a5fa;--green:#10b981;--green2:#34d399;
  --amber:#f59e0b;--amber2:#fbbf24;--red:#ef4444;--red2:#f87171;
  --purple:#8b5cf6;--purple2:#a78bfa;
  --text:#f1f5f9;--t2:#94a3b8;--t3:#475569;
  --font:'Noto Sans TC',sans-serif;--mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;padding:20px;}

.upload-container {
  background: var(--s1);
  border: 2px dashed var(--blue);
  border-radius: 10px;
  padding: 30px;
  text-align: center;
  margin-bottom: 20px;
  cursor: pointer;
  transition: all 0.2s;
}
.upload-container:hover { background: var(--s2); border-color: var(--green); }
.upload-title { font-size: 16px; font-weight: 700; color: var(--blue2); margin-bottom: 5px; }
.upload-sub { color: var(--t3); font-size: 11px; }
#fileInput { display: none; }

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:20px;position:relative;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:10px 10px 0 0}
.kpi.blue::before{background:var(--blue)}.kpi.green::before{background:var(--green)}
.kpi.amber::before{background:var(--amber)}.kpi.red::before{background:var(--red)}
.kpi-lbl{font-size:11px;color:var(--t3);margin-bottom:8px;letter-spacing:.5px}
.kpi-val{font-size:22px;font-weight:700;font-family:var(--mono);line-height:1}

.chart-grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.chart-card { background: var(--s1); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
.chart-title { font-size: 13px; font-weight: 700; color: var(--t2); margin-bottom: 15px; display: flex; justify-content: space-between; }
.badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
.b-blue { background: rgba(59,130,246,0.15); color: var(--blue2); }
.b-purple { background: rgba(139,92,246,0.15); color: var(--purple2); }
</style>
</head>
<body>

  <div class="upload-container" onclick="document.getElementById('fileInput').click()">
    <div class="upload-title">📥 點擊或將億看 ERP 銷貨單 CSV 檔案拖曳至此</div>
    <div class="upload-sub">單位分流規格版本：自動分離「單瓶出貨」與「箱裝出貨」</div>
    <input type="file" id="fileInput" accept=".csv">
  </div>

  <div class="kpi-grid">
    <div class="kpi blue">
      <div class="kpi-lbl">📦 本月銷貨總金額 (NT$)</div>
      <div class="kpi-val" id="val-sales">$0</div>
    </div>
    <div class="kpi green">
      <div class="kpi-lbl">🎯 零售總出貨量 (單瓶)</div>
      <div class="kpi-val" id="val-bottle-orders">0 瓶</div>
    </div>
    <div class="kpi purple">
      <div class="kpi-lbl">📦 大宗總出貨量 (箱裝)</div>
      <div class="kpi-val" id="val-box-orders">0 箱</div>
    </div>
    <div class="kpi red">
      <div class="kpi-lbl">📅 報表數據月份</div>
      <div class="kpi-val" id="val-month">未讀取</div>
    </div>
  </div>

  <div class="chart-grid-layout">
    <div class="chart-card">
      <div class="chart-title">📊 零售品項銷量排行 <span class="badge b-blue">單位：瓶</span></div>
      <div style="position:relative; height:280px;"><canvas id="bottle-chart"></canvas></div>
    </div>
    
    <div class="chart-card">
      <div class="chart-title">📊 大宗品項銷量排行 <span class="badge b-purple">單位：箱</span></div>
      <div style="position:relative; height:280px;"><canvas id="box-chart"></canvas></div>
    </div>
  </div>

<script>
let bottleChart = null;
let boxChart = null;

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  Papa.parse(file, {
    header: false,
    skipEmptyLines: true,
    complete: function(results) {
      parseUnitSplitData(results.data);
    }
  });
});

function parseUnitSplitData(dataset) {
  if (dataset.length < 2) return;

  let totalSales = 0;
  let totalBottles = 0;
  let totalBoxes = 0;
  
  let bottleSummary = {};
  let boxSummary = {};
  let detectedMonth = "未知";

  // 解析日期
  let firstRowStr = String(dataset[0][0] || '');
  let dateMatches = firstRowStr.match(/\d{4}\/\d{2}\/\d{2}/g);
  if (dateMatches && dateMatches.length >= 2) {
    detectedMonth = dateMatches[1].substring(0, 7).replace(/\//g, '-');
  } else if (dateMatches && dateMatches.length === 1) {
    detectedMonth = dateMatches[0].substring(0, 7).replace(/\//g, '-');
  }

  dataset.forEach((row, index) => {
    if (index < 2) return;

    let pName = row[0] ? String(row[0]).trim() : '';
    if (!pName || pName === '' || pName.includes('合計') || pName.includes('按品項') || pName.includes('折抵') || pName.includes('小卡')) return;

    let qty = parseFloat(String(row[1] || '0').replace(/,/g, ''));
    let amt = parseFloat(String(row[4] || '0').replace(/,/g, ''));

    if (!isNaN(amt) && amt > 0) totalSales += amt;

    if (!isNaN(qty) && qty > 0) {
      // 【核心邏輯】：根據品項名稱是否包含「箱」字，自動進行分流統計
      if (pName.includes('箱')) {
        totalBoxes += qty;
        boxSummary[pName] = (boxSummary[pName] || 0) + qty;
      } else {
        totalBottles += qty;
        bottleSummary[pName] = (bottleSummary[pName] || 0) + qty;
      }
    }
  });

  // 更新數據卡片
  document.getElementById('val-sales').textContent = 'NT$ ' + totalSales.toLocaleString();
  document.getElementById('val-bottle-orders').textContent = totalBottles.toLocaleString() + ' 瓶';
  document.getElementById('val-box-orders').textContent = totalBoxes.toLocaleString() + ' 箱';
  document.getElementById('val-month').textContent = detectedMonth;

  // 排序零售資料 (瓶)
  let sortedBottles = Object.entries(bottleSummary).filter(x => x[1] > 0).sort((b, a) => a[1] - b[1]);
  // 排序大宗資料 (箱)
  let sortedBoxes = Object.entries(boxSummary).filter(x => x[1] > 0).sort((b, a) => a[1] - b[1]);

  // 渲染雙圖表
  renderChart('bottle-chart', bottleChart, sortedBottles.map(x=>x[0]), sortedBottles.map(x=>x[1]), '#3b82f6', '出貨數量 (瓶)', c => bottleChart = c);
  renderChart('box-chart', boxChart, sortedBoxes.map(x=>x[0]), sortedBoxes.map(x=>x[1]), '#8b5cf6', '出貨數量 (箱)', c => boxChart = c);

  showNotification('⚡ 單位自動分流完成！已隔離箱裝與瓶裝數據！');
}

function renderChart(canvasId, chartObj, labels, data, color, datasetLabel, setChartRef) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  if (chartObj) { chartObj.destroy(); }

  let newChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: datasetLabel,
        data: data,
        backgroundColor: color,
        borderRadius: 5
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#94a3b8' } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } },
        y: { grid: { color: '#1e2a42' }, ticks: { color: '#94a3b8' } }
      }
    }
  });
  
  setChartRef(newChart); // 回傳新圖表實例防止重疊
}

function showNotification(msg) {
  const el = document.createElement('div');
  el.style.cssText='position:fixed;bottom:20px;right:20px;background:#10b981;color:#0b0e18;padding:12px 24px;border-radius:8px;font-weight:700;font-size:12px;z-index:999;';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
</script>
</body>
</html>
