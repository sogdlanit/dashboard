<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>決策執行儀表板 - 銷售報表直傳版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
:root{
  --bg:#080c14;--s1:#0f1420;--s2:#161d2e;--s3:#1d263d;--s4:#243047;
  --border:#1e2a42;--border2:#2a3858;
  --blue:#3b82f6;--blue2:#60a5fa;--green:#10b981;--green2:#34d399;
  --amber:#f59e0b;--amber2:#fbbf24;--red:#ef4444;--red2:#f87171;
  --text:#f1f5f9;--t2:#94a3b8;--t3:#475569;
  --font:'Noto Sans TC',sans-serif;--mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;padding:20px;}

.upload-container {
  background: var(--s1);
  border: 2px dashed var(--blue);
  border-radius: 10px;
  padding: 30px;
  text-align: center;
  margin-bottom: 20px;
  cursor: pointer;
  transition: all 0.2s;
}
.upload-container:hover { background: var(--s2); border-color: var(--green); }
.upload-title { font-size: 16px; font-weight: 700; color: var(--blue2); margin-bottom: 5px; }
.upload-sub { color: var(--t3); font-size: 11px; }
#fileInput { display: none; }

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:20px;position:relative;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:10px 10px 0 0}
.kpi.blue::before{background:var(--blue)}.kpi.green::before{background:var(--green)}
.kpi.amber::before{background:var(--amber)}.kpi.red::before{background:var(--red)}
.kpi-lbl{font-size:11px;color:var(--t3);margin-bottom:8px;letter-spacing:.5px}
.kpi-val{font-size:24px;font-weight:700;font-family:var(--mono);line-height:1}

.chart-card { background: var(--s1); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
.chart-title { font-size: 13px; font-weight: 700; color: var(--t2); margin-bottom: 15px; }
</style>
</head>
<body>

  <div class="upload-container" onclick="document.getElementById('fileInput').click()">
    <div class="upload-title">📥 點擊或將億看 ERP 銷貨單 CSV 檔案拖曳至此</div>
    <div class="upload-sub">鮮果多專用規格版本：精準欄位綁定與日期解析</div>
    <input type="file" id="fileInput" accept=".csv">
  </div>

  <div class="kpi-grid">
    <div class="kpi blue">
      <div class="kpi-lbl">📦 本月銷貨總金額 (NT$)</div>
      <div class="kpi-val" id="val-sales" style="color:var(--blue2)">$0</div>
    </div>
    <div class="kpi green">
      <div class="kpi-lbl">🎯 本月銷貨總數量 (瓶)</div>
      <div class="kpi-val" id="val-orders" style="color:var(--green2)">0</div>
    </div>
    <div class="kpi amber">
      <div class="kpi-lbl">🧾 有效銷貨品項數 (種)</div>
      <div class="kpi-val" id="val-count" style="color:var(--amber2)">0</div>
    </div>
    <div class="kpi red">
      <div class="kpi-lbl">📅 報表數據月份</div>
      <div class="kpi-val" id="val-month" style="color:var(--red2)">未讀取</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-title">📊 各品項銷量統計 (由大到小排序)</div>
    <div style="position:relative; height:300px;">
      <canvas id="dynamic-chart"></canvas>
    </div>
  </div>

<script>
let currentChart = null;

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  Papa.parse(file, {
    header: false,
    skipEmptyLines: true,
    complete: function(results) {
      parseFreshData(results.data);
    }
  });
});

function parseFreshData(dataset) {
  if (dataset.length < 2) return;

  let totalSales = 0;
  let totalOrders = 0;
  let productSummary = {};
  let detectedMonth = "未知";

  // 1. 先從第一列精確解析日期區間，尋找第二個日期（即結束日期，通常代表報表月份）
  let firstRowStr = String(dataset[0][0] || '');
  let dateMatches = firstRowStr.match(/\d{4}\/\d{2}\/\d{2}/g);
  if (dateMatches && dateMatches.length >= 2) {
    // 抓取結束日期的年份與月份，例如 "2026/05" 改為 "2026-05"
    detectedMonth = dateMatches[1].substring(0, 7).replace(/\//g, '-');
  } else if (dateMatches && dateMatches.length === 1) {
    detectedMonth = dateMatches[0].substring(0, 7).replace(/\//g, '-');
  }

  // 2. 逐列進行結構化掃描
  dataset.forEach((row, index) => {
    // 跳過前兩列（包含標題與欄位名稱列「按品項,數量...」）
    if (index < 2) return;

    let pName = row[0] ? String(row[0]).trim() : '';
    
    // 過濾掉無效列、空白列、以及合計、折抵等非實際生產排程品項
    if (!pName || pName === '' || pName.includes('合計') || pName.includes('按品項') || pName.includes('折抵') || pName.includes('小卡')) return;

    // 依據標準規格：第 1 欄為數量，第 4 欄為合計金額
    let qty = parseFloat(String(row[1] || '0').replace(/,/g, ''));
    let amt = parseFloat(String(row[4] || '0').replace(/,/g, ''));

    if (!isNaN(qty) && qty > 0) {
      totalOrders += qty;
      productSummary[pName] = (productSummary[pName] || 0) + qty;
    }
    if (!isNaN(amt) && amt > 0) {
      totalSales += amt;
    }
  });

  // 3. 更新數據到卡片
  let activeItemCount = Object.keys(productSummary).length;
  document.getElementById('val-sales').textContent = 'NT$ ' + totalSales.toLocaleString();
  document.getElementById('val-orders').textContent = totalOrders.toLocaleString() + ' 瓶';
  document.getElementById('val-count').textContent = activeItemCount + ' 種';
  document.getElementById('val-month').textContent = detectedMonth;

  // 排序並渲染圖表
  let sortedProducts = Object.entries(productSummary).sort((b, a) => a[1] - b[1]);
  let labels = sortedProducts.map(x => x[0]);
  let dataValues = sortedProducts.map(x => x[1]);

  updateChart(labels, dataValues);
  showNotification('⚡ 專用規格解析成功！月份與數據已校正！');
}

function updateChart(labels, data) {
  const ctx = document.getElementById('dynamic-chart').getContext('2d');
  if (currentChart) { currentChart.destroy(); }

  currentChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: '出貨數量 (瓶)',
        data: data,
        backgroundColor: '#3b82f6',
        borderRadius: 5
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#94a3b8' } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } },
        y: { grid: { color: '#1e2a42' }, ticks: { color: '#94a3b8' } }
      }
    }
  });
}

function showNotification(msg) {
  const el = document.createElement('div');
  el.style.cssText='position:fixed;bottom:20px;right:20px;background:#10b981;color:#0b0e18;padding:12px 24px;border-radius:8px;font-weight:700;font-size:12px;z-index:999;';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
</script>
</body>
</html>
