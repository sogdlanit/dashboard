<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMC 產銷動態庫存戰略表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
:root{
  --bg:#080c14;--s1:#0f1420;--s2:#161d2e;--s3:#1d263d;
  --border:#1e2a42;
  --blue:#3b82f6;--blue2:#60a5fa;--green:#10b981;--green2:#34d399;
  --amber:#f59e0b;--amber2:#fbbf24;--red:#ef4444;--red2:#f87171;
  --text:#f1f5f9;--t2:#94a3b8;--t3:#475569;
  --font:'Noto Sans TC',sans-serif;--mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;padding:20px;}

.upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.upload-box { background: var(--s1); border: 2px dashed var(--blue); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; }
.upload-box:hover { background: var(--s2); border-color: var(--green); }
.u-title { font-size: 14px; font-weight: 700; color: var(--blue2); margin-bottom: 4px; }
.u-sub { color: var(--t3); font-size: 11px; }
input[type="file"] { display: none; }

.card { background: var(--s1); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
.card-title { font-size: 14px; font-weight: 700; color: var(--t2); margin-bottom: 15px; border-left: 3px solid var(--blue); padding-left: 8px; }

.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { background: var(--s2); padding: 10px; text-align: left; color: var(--t2); font-weight: 700; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.mono { font-family: var(--mono); font-weight: 700; }

.badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
.b-red { background: rgba(239,68,68,0.2); color: var(--red2); }
.b-amber { background: rgba(245,158,11,0.2); color: var(--amber2); }
.b-green { background: rgba(16,185,129,0.2); color: var(--green2); }
</style>
</head>
<body>

  <div class="upload-grid">
    <div class="upload-box" onclick="document.getElementById('salesFile').click()">
      <div class="u-title">第一步：📥 拖入「銷售單明細 CSV」</div>
      <div class="u-sub" id="lbl-sales">尚未讀取本月銷速</div>
      <input type="file" id="salesFile" accept=".csv">
    </div>
    <div class="upload-box" onclick="document.getElementById('stockFile').click()">
      <div class="u-title">第二步：📥 拖入「庫存報表 ESZ018R.csv」</div>
      <div class="u-sub" id="lbl-stock">尚未讀取即時庫存</div>
      <input type="file" id="stockFile" accept=".csv">
    </div>
  </div>

  <div class="card">
    <div class="card-title">🚨 鮮果多 PMC 產銷動態天數預警與排產決策看板 (字串核心校正版)</div>
    <table class="tbl" id="strategy-table">
      <thead>
        <tr>
          <th>庫存品項名稱</th>
          <th>本月累計銷量</th>
          <th>日均消耗銷速</th>
          <th>現有總庫存 (總公司+中廚)</th>
          <th>動態可用天數 (DOS)</th>
          <th>戰略風險判定與排產決策建議</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="6" style="text-align:center; color:var(--t3); padding:30px;">請依序上傳銷售明細與庫存報表，系統將進行雙向核心字串對齊。</td></tr>
      </tbody>
    </table>
  </div>

<script>
let salesVolume = {}; 
let salesVelocity = {}; 
const DAYS_PASSED = 22; // 5月當前已過去天數基準

// 讀取銷售報表
document.getElementById('salesFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  Papa.parse(file, {
    header: false,
    skipEmptyLines: true,
    complete: function(results) {
      parseSales(results.data);
      document.getElementById('lbl-sales').textContent = "✅ 銷速鎖定完成";
      document.getElementById('lbl-sales').style.color = "var(--green2)";
      triggerExecution();
    }
  });
});

// 讀取庫存報表
document.getElementById('stockFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  Papa.parse(file, {
    header: false,
    skipEmptyLines: true,
    complete: function(results) {
      window.rawStockDataset = results.data;
      document.getElementById('lbl-stock').textContent = "✅ 庫存解碼完成";
      document.getElementById('lbl-stock').style.color = "var(--green2)";
      triggerExecution();
    }
  });
});

function parseSales(dataset) {
  salesVolume = {};
  salesVelocity = {};
  
  dataset.forEach((row, idx) => {
    if (idx < 2) return;
    let name = row[0] ? String(row[0]).trim() : '';
    if (!name || name.includes('合計') || name.includes('按品項') || name.includes('運費') || name.includes('小卡') || name.includes('折抵')) return;
    
    let qty = parseFloat(String(row[1] || '0').replace(/,/g, ''));
    if (!isNaN(qty) && qty > 0) {
      // 【核心修改一】：極大化清洗銷售品項字串，只留下純中文核心（如 "木瓜"、"綠果昔"）
      let cleanKey = name.replace(/300ml-/g, '')
                         .replace(/\[箱\]/g, '').replace(/\(箱\)/g, '')
                         .replace(/\[組\]/g, '').replace(/\(組\)/g, '')
                         .trim();
      
      // 累加可能因為規格不同而拆開的同品項銷量
      salesVolume[cleanKey] = (salesVolume[cleanKey] || 0) + qty;
    }
  });

  Object.keys(salesVolume).forEach(k => {
    salesVelocity[k] = salesVolume[k] / DAYS_PASSED;
  });
}

function triggerExecution() {
  if (!salesVelocity || !window.rawStockDataset) return;
  renderStrategyTable(window.rawStockDataset);
}

function renderStrategyTable(stockDataset) {
  const tbody = document.querySelector('#strategy-table tbody');
  tbody.innerHTML = '';

  stockDataset.forEach((row, idx) => {
    if (idx < 2) return; 

    let rawName = row[1] ? String(row[1]).trim() : '';
    if (!rawName || rawName === '' || rawName.includes('品項名稱')) return;

    // 【核心修改二】：清洗庫存品項名稱
    let cleanStockName = rawName.replace(/300ml-/g, '')
                                .replace(/\[箱\]/g, '').replace(/\(箱\)/g, '')
                                .replace(/\[組\]/g, '').replace(/\(組\)/g, '')
                                .trim();

    // 整合總公司倉庫(欄位3)與中央廚房(欄位4)的庫存
    let compStock = parseFloat(String(row[3] || '0').replace(/,/g, ''));
    let cbStock = parseFloat(String(row[4] || '0').replace(/,/g, ''));
    let totalStock = (isNaN(compStock) ? 0 : compStock) + (isNaN(cbStock) ? 0 : cbStock);

    let accumSales = 0;
    let velocity = 0;

    // 【核心修改三】：雙向交叉包含比對，徹底擊穿「木瓜」與「木瓜[箱]」的配對障礙
    Object.keys(salesVelocity).forEach(sKey => {
      if (cleanStockName !== "" && sKey !== "") {
        if (cleanStockName.includes(sKey) || sKey.includes(cleanStockName)) {
          accumSales = salesVolume[sKey];
          velocity = salesVelocity[sKey];
        }
      }
    });

    // 計算可用天數 (DOS)
    let dos = velocity > 0 ? (totalStock / velocity) : 999;

    let badge = '';
    let advice = '';

    if (velocity === 0) {
      badge = '<span class="badge b-green">無常態銷速</span>';
      advice = '庫存現狀安全。本月銷售明細中無消耗紀錄，暫無排產迫切性。';
    } else if (dos < 5) { // 提高安全庫存天數警戒至 5 天
      badge = '<span class="badge b-red">🚨 產線極危</span>';
      advice = `當前庫存僅能支撐 ${dos.toFixed(1)} 天。產線必須立即插單排產，否則面臨斷貨！`;
    } else if (dos >= 5 && dos <= 12) {
      badge = '<span class="badge b-amber">注意進料</span>';
      advice = `庫存可撐 ${dos.toFixed(1)} 天。消耗速度穩定，建議納入常態排產排程。`;
    } else {
      badge = '<span class="badge b-green">儲備充足</span>';
      advice = `結構安全（可撐 ${dos.toFixed(1)} 天）。目前無斷貨風險，產能優先調配給其他紅燈品項。`;
    }

    let tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-weight:700;">${rawName}</td>
      <td class="mono">${accumSales.toLocaleString()}</td>
      <td class="mono" style="color:var(--blue2);">${velocity.toFixed(1)} 單位/天</td>
      <td class="mono" style="color:var(--green2);">${totalStock.toLocaleString()}</td>
      <td class="mono" style="color:${dos < 5 ? 'var(--red2)' : 'var(--text)'}">${dos === 999 ? '—' : dos.toFixed(1) + ' 天'}</td>
      <td>${badge} <span style="margin-left:8px;">${advice}</span></td>
    `;
    tbody.appendChild(tr);
  });
}
</script>
</body>
</html>
