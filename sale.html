<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMC 產銷庫存戰略資訊表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
:root{
  --bg:#080c14;--s1:#0f1420;--s2:#161d2e;--s3:#1d263d;
  --border:#1e2a42;
  --blue:#3b82f6;--blue2:#60a5fa;--green:#10b981;--green2:#34d399;
  --amber:#f59e0b;--amber2:#fbbf24;--red:#ef4444;--red2:#f87171;
  --text:#f1f5f9;--t2:#94a3b8;--t3:#475569;
  --font:'Noto Sans TC',sans-serif;--mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;padding:20px;}

/* 雙上傳區區塊 */
.upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.upload-box { background: var(--s1); border: 2px dashed var(--blue); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; }
.upload-box:hover { background: var(--s2); }
.u-title { font-size: 14px; font-weight: 700; color: var(--blue2); margin-bottom: 4px; }
.u-sub { color: var(--t3); font-size: 11px; }
input[type="file"] { display: none; }

/* 戰略看板 */
.card { background: var(--s1); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
.card-title { font-size: 14px; font-weight: 700; color: var(--t2); margin-bottom: 15px; border-left: 3px solid var(--blue); padding-left: 8px; }

/* 表格樣式 */
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { background: var(--s2); padding: 10px; text-align: left; color: var(--t2); font-weight: 700; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.mono { font-family: var(--mono); font-weight: 700; }

/* 狀態標籤 */
.badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
.b-red { background: rgba(239,68,68,0.2); color: var(--red2); }
.b-amber { background: rgba(245,158,11,0.2); color: var(--amber2); }
.b-green { background: rgba(16,185,129,0.2); color: var(--green2); }
</style>
</head>
<body>

  <div class="upload-grid">
    <div class="upload-box" onclick="document.getElementById('salesFile').click()">
      <div class="u-title">第一步：📥 拖入「億看 ERP 銷貨明細.csv」</div>
      <div class="u-sub" id="lbl-sales">尚未讀取銷速資料</div>
      <input type="file" id="salesFile" accept=".csv">
    </div>
    <div class="upload-box" onclick="document.getElementById('stockFile').click()">
      <div class="u-title">第二步：📥 拖入「廠內成品庫存表.csv」</div>
      <div class="u-sub" id="lbl-stock">尚未讀取現有庫存</div>
      <input type="file" id="stockFile" accept=".csv">
    </div>
  </div>

  <div class="card">
    <div class="card-title">🚨 PMC 產銷平衡與斷料動態預警決策看板</div>
    <table class="tbl" id="strategy-table">
      <thead>
        <tr>
          <th>品項名稱</th>
          <th>當月累計銷量</th>
          <th>每日平均銷速 (瓶)</th>
          <th>目前廠內庫存</th>
          <th>動態安全天數 (DOS)</th>
          <th>戰略風險判定與建議決策</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="6" style="text-align:center; color:var(--t3); padding:30px;">請依序上傳左側「銷售明細」與右側「庫存現況」檔案，系統將自動啟動動態決策推演。</td></tr>
      </tbody>
    </table>
  </div>

<script>
let globalSalesVelocity = {}; // 記錄各品項的日均銷速
let globalAccumulatedQty = {}; // 記錄累計銷量

// 監聽銷售檔案
document.getElementById('salesFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  Papa.parse(file, {
    header: false,
    skipEmptyLines: true,
    complete: function(results) {
      calculateSalesVelocity(results.data);
      document.getElementById('lbl-sales').textContent = "✅ 銷速解析成功，已鎖定品項耗速";
      document.getElementById('lbl-sales').style.color = "var(--green2)";
    }
  });
});

// 監聽庫存檔案
document.getElementById('stockFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  Papa.parse(file, {
    header: false,
    skipEmptyLines: true,
    complete: function(results) {
      matchStockAndRender(results.data);
      document.getElementById('lbl-stock').textContent = "✅ 庫存對齊成功，已產出戰略建議";
      document.getElementById('lbl-stock').style.color = "var(--green2)";
    }
  });
});

// 解析銷售速度
function calculateSalesVelocity(dataset) {
  globalSalesVelocity = {};
  globalAccumulatedQty = {};
  
  // 預設當月已過去 22 天（實務上可改為動態計算）
  const daysPassed = 22; 

  dataset.forEach((row, index) => {
    if (index < 2) return;
    let pName = row[0] ? String(row[0]).trim() : '';
    if (!pName || pName === '' || pName.includes('合計') || pName.includes('按品項') || pName.includes('運費') || pName.includes('小卡') || pName.includes('折抵')) return;

    let qty = parseFloat(String(row[1] || '0').replace(/,/g, ''));
    if (!isNaN(qty) && qty > 0) {
      globalAccumulatedQty[pName] = (globalAccumulatedQty[pName] || 0) + qty;
    }
  });

  // 計算日均消耗速度
  Object.keys(globalAccumulatedQty).forEach(pName => {
    globalSalesVelocity[pName] = globalAccumulatedQty[pName] / daysPassed;
  });
}

// 隔空對齊庫存並推演戰略建議
function matchStockAndRender(stockDataset) {
  const tbody = document.querySelector('#strategy-table tbody');
  tbody.innerHTML = '';

  let hasData = false;

  stockDataset.forEach((row, index) => {
    // 假設庫存表結構：[0] 品項名稱, [1] 現有庫存量
    let pName = row[0] ? String(row[0]).trim() : '';
    if (!pName || pName === '' || pName.includes('品項') || pName.includes('合計')) return;

    let stockQty = parseFloat(String(row[1] || '0').replace(/,/g, ''));
    if (isNaN(stockQty)) return;

    hasData = true;

    // 提取對應的銷售數據
    let accumQty = globalAccumulatedQty[pName] || 0;
    let velocity = globalSalesVelocity[pName] || 0;
    
    // 計算可用天數 (DOS)
    let dos = velocity > 0 ? (stockQty / velocity) : 999; 

    // 戰略風險判定與決策建議邏輯
    let statusBadge = '';
    let recommendation = '';

    if (dos === 999) {
      statusBadge = '<span class="badge b-green">呆滯無銷量</span>';
      recommendation = '⚠️ 該品項本月無出貨紀錄，現有庫存屬於呆滯料，建議業務降價出清，停止排產。';
    } else if (dos < 3) {
      statusBadge = '<span class="badge b-red">🚨 急需插單</span>';
      recommendation = `🔥 庫存僅能撐 ${dos.toFixed(1)} 天。產線必須在 24 小時內插單排產，採購應立即確認原料。`;
    } else if (dos >= 3 && dos <= 7) {
      statusBadge = '<span class="badge b-amber">注意進料</span>';
      recommendation = `正常消耗中。建議安排在下週正常排程，採購需按前置時間（Lead Time）常態進料。`;
    } else {
      statusBadge = '<span class="badge b-green">安全儲備</span>';
      recommendation = `庫存充足（可撐 ${dos.toFixed(1)} 天）。產線暫不排產，產能調配給其他高風險紅燈品項。`;
    }

    let tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-weight:700;">${pName}</td>
      <td class="mono">${accumQty.toLocaleString()}</td>
      <td class="mono" style="color:var(--blue2);">${velocity.toFixed(1)}</td>
      <td class="mono" style="color:var(--green2);">${stockQty.toLocaleString()}</td>
      <td class="mono" style="color:${dos < 3 ? 'var(--red2)' : 'var(--text)'}">${dos === 999 ? '—' : dos.toFixed(1) + ' 天'}</td>
      <td><div style="display:flex; align-items:center; gap:8px;">${statusBadge} <span>${recommendation}</span></div></td>
    `;
    tbody.appendChild(tr);
  });

  if (!hasData) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--red2);">庫存對齊失敗，請確認廠內庫存表的品項名稱是否正確。</td></tr>`;
  }
}
</script>
</body>
</html>
